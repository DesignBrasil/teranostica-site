<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46" role="img" aria-label="Sistemática Teranóstico">
  <!-- os quatro níveis aninhados da prancha sistêmica (ecossistema ⊃ sistema ⊃ serviços ⊃ jornadas)
       como anéis em volta de um núcleo: o átomo teranóstico. O núcleo tem duas metades: ver (azul) e tratar (verde). -->
  <g fill="none" stroke="#0c3a6f" stroke-linejoin="round">
    <circle cx="23" cy="23" r="21.5" stroke-width="1.8"/>
    <circle cx="23" cy="23" r="16" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="10.8" stroke-width="1.3"/>
    <circle cx="23" cy="23" r="6.2" stroke-width="1.1"/>
  </g>
  <path d="M23 20.2 a2.8 2.8 0 0 0 0 5.6 z" fill="#1774DE"/>
  <path d="M23 20.2 a2.8 2.8 0 0 1 0 5.6 z" fill="#0f7a64"/>
</svg>
